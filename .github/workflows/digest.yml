name: Digest run

on:
  # Spread requests out to avoid short-window rate limits.
  # The Python daily cap limits actual summaries to four per Singapore day.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FREE_MODE: "true"
          MAX_VIDEOS_PER_RUN: "1"
          DAILY_VIDEO_CAP: "4"
        run: python -m src.main

      - name: Commit bot state only
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "digest: update bot state"
          git push
