name: Digest run

on:
  # Check YouTube uploads hourly. Telegram commands use polling only before Worker mode is configured. Python enforces a
  # one-hour Gemini request cooldown; no fixed daily summary cap.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          FREE_MODE: "false"
          MAX_VIDEOS_PER_RUN: "1"
          DAILY_VIDEO_CAP: "0"
          MIN_HOURS_BETWEEN_GEMINI_REQUESTS: "1"
        run: python -m src.main

      - name: Commit bot state only
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "digest: update bot state"
          git push
