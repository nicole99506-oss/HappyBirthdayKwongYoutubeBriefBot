name: Set Telegram webhook and command menu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Telegram webhook and slash-command menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x

          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_WEBHOOK_SECRET BOT_WORKER_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

          worker_url="${BOT_WORKER_URL%/}"
          if [[ "$worker_url" == */health || "$worker_url" == */telegram ]]; then
            echo "BOT_WORKER_URL must be the base Worker URL, without /health or /telegram."
            exit 1
          fi

          payload="$(jq -n \
            --arg url "${worker_url}/telegram" \
            --arg secret "$TELEGRAM_WEBHOOK_SECRET" \
            '{url: $url, secret_token: $secret, allowed_updates: ["message", "callback_query"]}')"

          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook")"

          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "Telegram webhook configured successfully."

          commands="$(jq -n '[
            {"command":"add","description":"新增 YouTube 頻道"},
            {"command":"list","description":"查看追蹤頻道／移除頻道"},
            {"command":"status","description":"查看摘要佇列與服務狀態"}
          ]')"

          set_commands() {
            local scope_json="$1"
            local response
            response="$(jq -n --argjson commands "$commands" --argjson scope "$scope_json" \
              '{commands: $commands, scope: $scope}')"
            local result
            result="$(curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$response" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands")"
            echo "$result" | jq .
            echo "$result" | jq -e '.ok == true' >/dev/null
          }

          set_commands '{"type":"default"}'
          set_commands '{"type":"all_private_chats"}'
          set_commands "$(jq -n --argjson chat_id "$TELEGRAM_CHAT_ID" '{type:"chat", chat_id:$chat_id}')"
          echo "Telegram slash-command menu updated for default, private chats, and configured chat."
