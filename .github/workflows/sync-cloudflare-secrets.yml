name: Sync Cloudflare Worker secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Sync existing GitHub secrets to the deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x

          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID YOUTUBE_API_KEY TELEGRAM_WEBHOOK_SECRET BOT_INTERNAL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          printf '%s' "$TELEGRAM_BOT_TOKEN" | wrangler secret put TELEGRAM_BOT_TOKEN --config cloudflare/wrangler.toml
          printf '%s' "$TELEGRAM_CHAT_ID" | wrangler secret put TELEGRAM_CHAT_ID --config cloudflare/wrangler.toml
          printf '%s' "$YOUTUBE_API_KEY" | wrangler secret put YOUTUBE_API_KEY --config cloudflare/wrangler.toml
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | wrangler secret put TELEGRAM_WEBHOOK_SECRET --config cloudflare/wrangler.toml
          printf '%s' "$BOT_INTERNAL_TOKEN" | wrangler secret put BOT_INTERNAL_TOKEN --config cloudflare/wrangler.toml
