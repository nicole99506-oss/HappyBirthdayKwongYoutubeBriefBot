name: Restore tracked channels to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import existing channel list into D1
        env:
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${BOT_WORKER_URL:-}" || -z "${BOT_INTERNAL_TOKEN:-}" ]]; then
            echo "Required GitHub Actions secrets BOT_WORKER_URL or BOT_INTERNAL_TOKEN are missing."
            exit 1
          fi
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          with open("data/state.json", "r", encoding="utf-8") as f:
              state = json.load(f)
          channels = [
              {
                  "channel_id": cid,
                  "title": ch.get("title", cid),
                  "thumb": ch.get("thumb", ""),
                  "backfill": "none",
              }
              for cid, ch in state.get("channels", {}).items()
          ]
          if not channels:
              raise SystemExit("No existing channels found in data/state.json; nothing imported.")

          url = os.environ["BOT_WORKER_URL"].rstrip("/") + "/internal/bootstrap"
          body = json.dumps({"channels": channels}).encode("utf-8")
          req = urllib.request.Request(
              url, data=body, method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["BOT_INTERNAL_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              response_body = e.read(800).decode("utf-8", errors="replace")
              print(f"Bootstrap HTTP status: {e.code}")
              print(f"Response server: {e.headers.get('server', 'unknown')}")
              print(f"Response content type: {e.headers.get('content-type', 'unknown')}")
              print(f"Cloudflare Ray ID: {e.headers.get('cf-ray', 'not present')}")
              if response_body:
                  print("Response body excerpt (first 800 characters):")
                  print(response_body[:800])
              raise SystemExit("Bootstrap request was rejected. The response details above help identify which layer returned the error.")
          if not result.get("ok"):
              raise SystemExit("Cloudflare Worker did not confirm the import.")
          print("Cloudflare D1 channel restore request completed.")
          print("Channels in repository state:", len(channels))
          print("Channels imported by Worker:", result.get("imported", 0))
          print("Already bootstrapped:", result.get("already_bootstrapped", False))
          if result.get("already_bootstrapped") and result.get("imported", 0) == 0:
              raise SystemExit("D1 says bootstrap already happened; no changes were made.")
          PY
